name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Run detect-secrets against baseline
        # Fails if any NEW secrets are introduced beyond the checked-in baseline.
        # To update the baseline after a confirmed false positive:
        #   detect-secrets scan --all-files > .secrets.baseline
        #   git add .secrets.baseline && git commit -m "chore: update secrets baseline"
        run: |
          detect-secrets-hook \
            --baseline .secrets.baseline \
            --exclude-files '(^\.venv/|^runs/|^models/|^datasets/|^depthai-ml-training/|\.ipynb$|\.pt$|\.onnx$|\.bin$|\.jpg$|\.jpeg$|\.png$|\.mp4$|\.avi$|\.mov$)' \
            $(git diff --name-only --diff-filter=ACMRT origin/${{ github.base_ref || 'main' }}...HEAD 2>/dev/null || git ls-files)
